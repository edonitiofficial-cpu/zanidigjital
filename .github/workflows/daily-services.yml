name: KEDS dhe moti në mbrëmje

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Rifresko tani KEDS dhe motin, edhe jashtë orarit'
        type: boolean
        default: false
  repository_dispatch:
    types: [perditeso_sherbimet]
  schedule:
    # UTC: 21:30 in Kosovo in summer / winter. Python checks local time and date.
    - cron: '30 19,20 * * *'

permissions:
  contents: write

concurrency:
  group: zani-digjital-news
  cancel-in-progress: false

jobs:
  daily-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install tzdata
      - name: Merr njoftimet dhe parashikimin
        env:
          REFRESH_NOW: ${{ inputs.refresh }}
        run: |
          if [ "$REFRESH_NOW" = "true" ]; then
            python daily_services.py --refresh
          else
            python daily_services.py
          fi
      - name: Ruaj përditësimin
        run: |
          if [ ! -f daily-services.json ]; then exit 0; fi
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add daily-services.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Përditëso KEDS dhe motin"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Kontrollo burimet pas ruajtjes së raportit
        run: |
          python -c "import json, pathlib; p=pathlib.Path('daily-services.json'); d=json.loads(p.read_text()) if p.exists() else {}; assert all(d.get(k,{}).get('status') != 'error' for k in ('keds','weather')), 'Burimi deshtoi; shiko daily-services.json'"
