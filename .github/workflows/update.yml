name: Motori i Zani Digjital

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6-22 * * *'

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalo modulet
        run: pip install feedparser groq

      - name: Ekzekuto rishkrimin e lajmeve
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py

      - name: Ruaj dhe publiko online
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lajmet.json
          git commit -m "U shtuan lajme te reja" || echo "S'ka lajme te reja"
          git push
