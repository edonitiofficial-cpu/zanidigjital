name: Motori i Zani Digjital

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Merr dosjet e projektit
        uses: actions/checkout@v4

      - name: Bëj gati gjuhën Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalo modulet
        run: pip install feedparser google-generativeai

      - name: Ekzekuto rishkrimin e lajmeve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Ruaj dhe publiko online
        run: |
          git config --global user.name "ZaniDigjital Bot"
          git config --global user.email "bot@zanidigjital.com"
          git add lajmet.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "U publikuan lajme të reja" && git push)
