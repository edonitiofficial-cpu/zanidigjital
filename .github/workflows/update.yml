
name: Motori i Zani Digjital

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: zani-digjital-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalo modulet
        run: pip install feedparser groq

      - name: Ekzekuto rishkrimin e lajmeve
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py

      - name: Ruaj dhe publiko online
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"

          git add lajmet.json

          if git diff --cached --quiet; then
            echo "S'ka lajme të reja"
            exit 0
          fi

          git commit -m "U shtuan lajme te reja automatikisht"
          git push
