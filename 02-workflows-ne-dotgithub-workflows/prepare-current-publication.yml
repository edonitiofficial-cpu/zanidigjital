name: Përgatit pamjen nga lajmet aktuale
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: zani-digjital-news
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install tzdata
      - name: Gjenero vetëm pamjen dhe katalogun
        run: python tools/prepare_current_publication.py
      - name: Ruaj vetëm skedarët e gjeneruar të pamjes
        id: save
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add index.html news-catalog.json news-archive/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Përgatit pamjen nga arkivi aktual pa zëvendësuar lajmet"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Nise publikimin e pamjes
        if: ${{ steps.save.outputs.changed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python request_pages_build.py
