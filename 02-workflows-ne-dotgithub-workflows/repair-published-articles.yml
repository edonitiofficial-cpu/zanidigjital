name: Pastro artikujt ekzistues nga burimi
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Sa artikuj të fundit të kontrollohen (1–100)'
        type: number
        default: 50
      refetch:
        description: 'Rimerr trupin/fotografitë nga Telegrafi'
        type: boolean
        default: true
      dry_run:
        description: 'Vetëm kontroll, pa ruajtur ndryshime'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: zani-digjital-news
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install lxml tzdata
      - run: python -m unittest test_article_content
      - name: Pastro vetëm artikujt aktualë të repository-t
        env:
          REPAIR_LIMIT: ${{ inputs.limit }}
          REFETCH: ${{ inputs.refetch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--limit "$REPAIR_LIMIT")
          if [ "$REFETCH" = "true" ]; then args+=(--refetch); fi
          if [ "$DRY_RUN" != "true" ]; then args+=(--apply); fi
          python tools/repair_published_articles.py "${args[@]}"
      - name: Ruaj vetëm artikujt e korrigjuar
        id: save
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add lajmet.json lajme/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Pastro tekstet e importuara dhe rikthe mediat e artikujve"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publiko korrigjimin në Pages
        if: ${{ steps.save.outputs.changed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python request_pages_build.py
