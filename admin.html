<script>
        // Lidhja me Supabase (E ndryshuam variablën në 'sb' për të shmangur konfliktet)
        const supabaseUrl = 'https://qqgkhioaqsbzygwconbh.supabase.co';
        const supabaseKey = 'sb_publishable_2LH0wWF2qnbrWZjwZWBlyg_6-4sSYai';
        const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('admin-dashboard');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const btnText = document.getElementById('login-btn').querySelector('span');

        // Kontrollo nëse jemi të kyçur kur hapet faqja
        async function checkSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                showDashboard(session.user.email);
            }
        }

        // Funksioni i Kyçjes
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // KJO ndalon rifreskimin e gabuar të faqes!
            btnText.innerText = "Po kyçet...";
            loginError.classList.add('hidden');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await sb.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                loginError.innerText = "Kredenciale të gabuara. Provo përsëri.";
                loginError.classList.remove('hidden');
                btnText.innerText = "Kyçu";
            } else {
                showDashboard(data.user.email);
            }
        });

        // Funksioni i Daljes
        async function logOut() {
            await sb.auth.signOut();
            dashboardScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            btnText.innerText = "Kyçu";
        }

        // Ndërrimi i pamjeve UI
        function showDashboard(email) {
            loginScreen.classList.add('hidden');
            dashboardScreen.classList.remove('hidden');
            document.getElementById('admin-email').innerText = email;
        }

        // Navigimi mes rubrikave në Admin
        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.add('hidden'));
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-gray-100', 'text-black');
                link.classList.add('text-gray-500');
            });

            document.getElementById(`sec-${sectionId}`).classList.remove('hidden');
            
            const activeLink = document.getElementById(`nav-${sectionId}`);
            activeLink.classList.remove('text-gray-500');
            activeLink.classList.add('bg-gray-100', 'text-black');
        }

        // Ekzekuto kontrollin e sesionit në fillim
        checkSession();
    </script>
