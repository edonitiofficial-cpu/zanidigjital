<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zani Digjital - Lajmi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    .permbajtja p { margin-bottom: 1.25rem; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="text-gray-900">

  <!-- Header -->
  <header class="bg-white sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <a href="index.html" class="flex-shrink-0">
        <img src="zanidigjital.png" alt="ZaniDigjital Logo" class="h-10 object-contain">
      </a>
      
      <nav id="main-categories" class="flex flex-wrap justify-center gap-4 text-xs font-bold uppercase tracking-wider text-gray-500">
        <a href="index.html" class="hover:text-blue-600 transition">Krye</a>
        <a href="index.html" class="hover:text-blue-600 transition">Lajme</a>
        <a href="index.html" class="hover:text-blue-600 transition">Kosovë</a>
        <a href="index.html" class="hover:text-blue-600 transition">Politikë</a>
        <a href="index.html" class="hover:text-blue-600 transition">Ekonomi</a>
        <a href="index.html" class="hover:text-blue-600 transition">Sport</a>
        <a href="index.html" class="hover:text-blue-600 transition">Teknologji</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex flex-col lg:flex-row gap-8">
    
    <!-- Pjesa e Majtë: Artikulli Kryesor -->
    <article class="lg:w-2/3 bg-white p-6 lg:p-10 rounded-2xl shadow-sm border border-gray-100" id="artikulli-container">
        <p class="text-center text-gray-500">Duke ngarkuar lajmin...</p>
    </article>

    <!-- Pjesa e Djathtë: Sugjerimet dhe Reklamat -->
    <aside class="lg:w-1/3 space-y-6">
      
      <!-- Seksioni i Sugjerimeve -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="font-extrabold text-lg mb-4 text-gray-900 border-b pb-2 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-500"></span> Lexo më shumë
        </h3>
        <div id="sugjerime-container" class="space-y-4">
           <p class="text-gray-400 text-sm">Po ngarkon sugjerimet...</p>
        </div>
      </div>

      <!-- Hapësira Reklamuese 1 (Burger) -->
      <a href="#" target="_blank" class="block rounded-2xl overflow-hidden shadow-sm hover:opacity-90 hover:shadow-md transition duration-300">
          <img src="burger.png" alt="Reklama 1" class="w-full h-auto object-cover">
      </a>

      <!-- Hapësira Reklamuese 2 (Karrige/Mobilje) -->
      <a href="#" target="_blank" class="block rounded-2xl overflow-hidden shadow-sm hover:opacity-90 hover:shadow-md transition duration-300">
          <img src="chair.png" alt="Reklama 2" class="w-full h-auto object-cover">
      </a>

    </aside>
  </main>

  <footer class="bg-white border-t border-gray-200 py-8 mt-8">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-gray-500 text-sm font-medium">&copy; 2026 ZaniDigjital. Të gjitha të drejtat e rezervuara.</p>
    </div>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const paramLink = urlParams.get('link'); 
    const paramId = urlParams.get('id') || urlParams.get('lajmi') || urlParams.get('index');

    if (paramLink || paramId !== null) {
        fetch('lajmet.json')
            .then(response => response.json())
            .then(data => {
                let lajmi = null;
                let lajmiIndex = -1;
                
                if (paramLink) {
                    lajmiIndex = data.findIndex(item => item.link_origjinal === paramLink);
                    lajmi = data[lajmiIndex];
                } else if (paramId !== null) {
                    lajmiIndex = parseInt(paramId);
                    lajmi = data[lajmiIndex];
                }

                if (lajmi) {
                    // Renderimi i lajmit
                    let permbajtjaHTML = lajmi.permbajtja.split('\n').map(p => p.trim() ? `<p>${p}</p>` : '').join('');
                    
                    document.getElementById('artikulli-container').innerHTML = `
                        <div class="flex items-center gap-4 mb-4 text-sm font-bold">
                            <span class="text-blue-600 uppercase tracking-wider">${lajmi.kategoria}</span>
                            <span class="text-gray-400 font-normal">🕒 ${lajmi.koha}</span>
                        </div>
                        <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 leading-tight mb-6">${lajmi.titulli}</h1>
                        <img src="${lajmi.imazhi}" class="w-full h-auto rounded-xl object-cover mb-8 shadow-sm" alt="${lajmi.titulli}">
                        <div class="permbajtja text-[17px] text-gray-700 leading-relaxed font-medium">
                            ${permbajtjaHTML}
                        </div>
                    `;

                    // Renderimi i sugjerimeve
                    const sugjerime = [];
                    for(let i=0; i < data.length; i++) {
                        if(i !== lajmiIndex) {
                            sugjerime.push({ ...data[i], originalId: i });
                        }
                        if(sugjerime.length === 5) break; 
                    }

                    document.getElementById('sugjerime-container').innerHTML = sugjerime.map(s => `
                        <a href="artikulli.html?id=${s.originalId}" class="group flex gap-4 items-center pb-4 border-b border-gray-50 last:border-0 last:pb-0">
                            <img src="${s.imazhi}" class="w-20 h-20 object-cover rounded-lg shadow-sm group-hover:opacity-90 transition" alt="">
                            <div class="flex-1">
                                <span class="text-[10px] text-blue-500 font-bold uppercase tracking-wider">${s.kategoria}</span>
                                <h4 class="text-[13px] font-extrabold text-gray-800 leading-snug group-hover:text-blue-600 transition line-clamp-2 mt-1">
                                    ${s.titulli}
                                </h4>
                            </div>
                        </a>
                    `).join('');

                } else {
                    document.getElementById('artikulli-container').innerHTML = '<h2 class="text-2xl font-bold text-red-500">Lajmi nuk u gjet në databazë!</h2>';
                }
            })
            .catch(error => {
                document.getElementById('artikulli-container').innerHTML = '<h2 class="text-2xl font-bold text-red-500">Pati një problem gjatë ngarkimit të lajmit.</h2>';
            });
    } else {
        window.location.href = 'index.html';
    }
  </script>
</body>
</html>
