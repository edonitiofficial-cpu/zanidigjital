<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zani Digjital | Lajmi</title>
    
    <!-- SEO BAZË (Dinamike nga JavaScript më poshtë) -->
    <meta name="description" content="Lexoni lajmin e plotë në Zani Digjital, portali më inovativ i lajmeve në Kosovë.">
    <link rel="canonical" id="canonical-link" href="https://zanidigjital.com/">
    
    <link rel="icon" type="image/png" href="zanidigjitalfavicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; }
        .permbajtja p { margin-bottom: 1.5rem; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="text-gray-900 antialiased">

    <!-- HEADER -->
    <header class="bg-white sticky top-0 z-50 shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <a href="index.html" class="flex-shrink-0 mb-4 md:mb-0">
                    <img src="zanidigjital.png" alt="ZaniDigjital Logo" class="h-16 object-contain" onerror="this.src='https://via.placeholder.com/200x50/ffffff/000000?text=ZANI+DIGJITAL+LOGO'">
                </a>
                
                <nav id="main-categories" class="flex flex-wrap justify-center gap-4 sm:gap-6 font-semibold text-gray-600">
                    <a href="index.html" class="hover:text-black transition">Ballina</a>
                    <a href="index.html?kategoria=Lajme" class="hover:text-black transition">Lajme</a>
                    <a href="index.html?kategoria=Politikë" class="hover:text-black transition">Politikë</a>
                    <a href="index.html?kategoria=Ekonomi" class="hover:text-black transition">Ekonomi</a>
                    <a href="index.html?kategoria=Sport" class="hover:text-black transition">Sport</a>
                    <a href="index.html?kategoria=Teknologji" class="hover:text-black transition">Teknologji</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex flex-col lg:flex-row gap-8">
        
        <article class="lg:w-2/3 bg-white p-6 lg:p-10 rounded-2xl shadow-sm border border-gray-100 relative" id="artikulli-container">
            <a href="index.html" class="inline-flex items-center text-sm font-bold text-gray-500 hover:text-black mb-6 transition">
                ← Kthehu te Ballina
            </a>
            <p class="text-center text-gray-500 font-medium">Duke ngarkuar lajmin...</p>
        </article>

        <aside class="lg:w-1/3 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="font-extrabold text-lg mb-4 text-gray-900 border-b border-gray-100 pb-3 flex items-center gap-2">
                    <span class="bg-black text-white px-2 py-1 rounded text-xs uppercase">Të rejat</span> Lexo më shumë
                </h3>
                <div id="sugjerime-container" class="space-y-4">
                    <p class="text-gray-400 text-sm">Po ngarkon sugjerimet...</p>
                </div>
            </div>

            <!-- Hapësira Reklamuese -->
            <a href="#" target="_blank" class="block rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:opacity-90 hover:shadow-md transition duration-300 relative">
                <span class="absolute top-2 right-2 bg-yellow-400 text-black text-[10px] font-bold px-2 py-1 rounded uppercase z-10">Sponsorizuar</span>
                <img src="burger.png" class="w-full h-auto object-cover" onerror="this.src='https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=400&auto=format&fit=crop'">
            </a>
            <a href="#" target="_blank" class="block rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:opacity-90 hover:shadow-md transition duration-300 relative">
                <span class="absolute top-2 right-2 bg-yellow-400 text-black text-[10px] font-bold px-2 py-1 rounded uppercase z-10">Sponsorizuar</span>
                <img src="chair.png" class="w-full h-auto object-cover" onerror="this.src='https://images.unsplash.com/photo-1505843490538-5133c6c7d0e1?q=80&w=400&auto=format&fit=crop'">
            </a>
        </aside>
    </main>

    <footer class="bg-white border-t border-gray-200 py-8 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm font-medium">&copy; 2026 Zani Digjital. Të gjitha të drejtat e rezervuara.</p>
        </div>
    </footer>

    <script>
        function getCategoryBg(cat) {
            const colors = { 'Sport': 'bg-green-600', 'Politikë': 'bg-red-600', 'Teknologji': 'bg-blue-600', 'Tech': 'bg-blue-600', 'Ekonomi': 'bg-yellow-600', 'Lajme': 'bg-black' };
            return colors[cat] || 'bg-black';
        }
        function getCategoryText(cat) {
            const colors = { 'Sport': 'text-green-600', 'Politikë': 'text-red-600', 'Teknologji': 'text-blue-600', 'Tech': 'text-blue-600', 'Ekonomi': 'text-yellow-600', 'Lajme': 'text-black' };
            return colors[cat] || 'text-black';
        }

        // Funksioni për krijimin e slug-ut
        function krijoSlug(titulli) {
            if (!titulli) return '';
            return titulli.toString().toLowerCase()
                .replace(/ë/g, 'e').replace(/ç/g, 'c')
                .replace(/[^a-z0-9 -]/g, '') 
                .replace(/\s+/g, '-') 
                .replace(/-+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const paramLink = urlParams.get('link'); 
        const paramLajmi = urlParams.get('lajmi'); // Slug i ri
        const paramId = urlParams.get('id') || urlParams.get('index'); // Numri i vjetër për backward compatibility

        if (paramLink || paramLajmi || paramId !== null) {
            fetch('lajmet.json')
                .then(response => response.json())
                .then(data => {
                    let lajmi = null;
                    let lajmiIndex = -1;
                    
                    if (paramLink) {
                        lajmiIndex = data.findIndex(item => item.link_origjinal === paramLink);
                    } else if (paramLajmi) {
                        // Kërkon bazuar në slug-un e ri
                        lajmiIndex = data.findIndex(item => {
                            const itemSlug = item.slug ? item.slug : krijoSlug(item.titulli);
                            return itemSlug === paramLajmi;
                        });
                    } else if (paramId !== null) {
                        // Fallback për linqet e vjetra
                        lajmiIndex = parseInt(paramId);
                    }

                    if (lajmiIndex >= 0 && lajmiIndex < data.length) {
                        lajmi = data[lajmiIndex];
                    }

                    if (lajmi) {
                        const catBg = getCategoryBg(lajmi.kategoria);
                        let permbajtjaHTML = lajmi.permbajtja.split('\n').map(p => p.trim() ? `<p>${p}</p>` : '').join('');
                        
                        // SEO Dinamike
                        document.title = `${lajmi.titulli} - Zani Digjital`;
                        
                        // Linku zyrtar për ndarje në rrjete sociale
                        const currentSlug = lajmi.slug ? lajmi.slug : krijoSlug(lajmi.titulli);
                        const shareUrl = `https://zanidigjital.com/lajme/${currentSlug}.html`;
                        document.getElementById('canonical-link').href = shareUrl;

                        // Ndërtimi i pamjes së lajmit me Butonat Share
                        document.getElementById('artikulli-container').innerHTML = `
                            <div class="flex items-center gap-4 mb-4 font-bold">
                                <span class="${catBg} text-white px-3 py-1 rounded text-xs uppercase tracking-wider">${lajmi.kategoria}</span>
                                <span class="text-gray-400 text-sm font-medium">${lajmi.koha}</span>
                            </div>
                            <h1 class="text-3xl md:text-5xl font-black text-gray-900 leading-tight mb-6">${lajmi.titulli}</h1>
                            
                            <!-- SHARE BUTONAT -->
                            <div class="flex flex-wrap gap-2 mb-8">
                                <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="bg-[#1877F2] text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition flex items-center gap-2">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                                    Ndaj
                                </a>
                                <a href="https://twitter.com/intent/tweet?url=${shareUrl}&text=${encodeURIComponent(lajmi.titulli)}" target="_blank" class="bg-black text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-800 transition flex items-center gap-2">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                                    Posto
                                </a>
                                <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(lajmi.titulli)}%20${shareUrl}" target="_blank" class="bg-[#25D366] text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-green-600 transition flex items-center gap-2">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.031 0C5.385 0 0 5.385 0 12.031c0 2.126.549 4.156 1.594 5.969L.25 24l6.188-1.594A11.966 11.966 0 0012.031 24c6.646 0 12.031-5.385 12.031-12.031S18.677 0 12.031 0zm3.625 17.156c-.156.469-.938.875-1.344.938-.375.063-.844.094-2.281-.469-1.75-.688-2.875-2.5-3.25-3C8.406 14.156 7.5 12.688 7.5 11.156c0-1.563.813-2.313 1.094-2.625.281-.313.625-.375.844-.375.219 0 .438 0 .625.031.188.031.438-.063.688.531.25.625.875 2.125.938 2.25.063.156.125.344.031.531-.094.188-.156.281-.313.469-.156.188-.344.344-.469.531-.156.156-.313.344-.125.656.188.344.813 1.375 1.75 2.188 1.219 1.031 2.25 1.375 2.563 1.531.313.156.5.125.688-.094.188-.25.813-.969 1.031-1.313.219-.344.438-.281.719-.188.281.094 1.781.844 2.094 1 .313.156.5.219.594.344.094.156.094.656-.063 1.125z"/></svg>
                                    Dërgo
                                </a>
                            </div>

                            <img src="${lajmi.imazhi}" class="w-full h-auto max-h-[500px] rounded-xl object-cover mb-10 shadow-sm border border-gray-100" alt="${lajmi.titulli}">
                            
                            <div class="permbajtja text-[18px] text-gray-800 leading-relaxed font-medium">
                                ${permbajtjaHTML}
                            </div>
                        `;

                        const sugjerime = [];
                        for(let i = 0; i < data.length; i++) {
                            if(i !== lajmiIndex) {
                                sugjerime.push({ ...data[i], originalId: i });
                            }
                            if(sugjerime.length === 5) break; 
                        }

                        document.getElementById('sugjerime-container').innerHTML = sugjerime.map(s => {
                            const catText = getCategoryText(s.kategoria);
                            const slug = s.slug ? s.slug : krijoSlug(s.titulli);
                            return `
                            <a href="artikulli.html?lajmi=${slug}" class="group flex gap-4 items-center pb-4 border-b border-gray-50 last:border-0 last:pb-0">
                                <img src="${s.imazhi}" class="w-20 h-20 object-cover rounded-lg shadow-sm group-hover:opacity-90 transition" alt="">
                                <div class="flex-1">
                                    <span class="text-[10px] ${catText} font-bold uppercase tracking-wider">${s.kategoria}</span>
                                    <h4 class="text-[14px] font-bold text-gray-800 leading-snug group-hover:underline transition line-clamp-2 mt-1">
                                        ${s.titulli}
                                    </h4>
                                </div>
                            </a>
                        `}).join('');

                    } else {
                        document.getElementById('artikulli-container').innerHTML = '<h2 class="text-2xl font-bold text-red-500">Lajmi nuk u gjet në databazë!</h2>';
                    }
                })
                .catch(error => {
                    document.getElementById('artikulli-container').innerHTML = '<h2 class="text-2xl font-bold text-red-500">Pati një problem gjatë ngarkimit të lajmit.</h2>';
                });
        } else {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
