<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZaniDigjital - Lajme të zgjedhura. Në një vend.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .gradient-overlay { background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 100%); }
  </style>
</head>
<body class="text-gray-900">

  <!-- Header i pastër -->
  <header class="bg-white sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <a href="#" onclick="filterNews('Krye')" class="flex-shrink-0">
        <img src="logo.jpg" alt="ZaniDigjital Logo" class="h-10 object-contain">
      </a>
      
      <nav id="main-categories" class="flex flex-wrap justify-center gap-4 text-xs font-bold uppercase tracking-wider text-gray-500">
        <button onclick="filterNews('Krye')" class="hover:text-blue-600 transition">Krye</button>
        <button onclick="filterNews('Lajme')" class="hover:text-blue-600 transition">Lajme</button>
        <button onclick="filterNews('Kosovë')" class="hover:text-blue-600 transition">Kosovë</button>
        <button onclick="filterNews('Politikë')" class="hover:text-blue-600 transition">Politikë</button>
        <button onclick="filterNews('Ekonomi')" class="hover:text-blue-600 transition">Ekonomi</button>
        <button onclick="filterNews('Sport')" class="hover:text-blue-600 transition">Sport</button>
        <button onclick="filterNews('Teknologji')" class="hover:text-blue-600 transition">Teknologji</button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-12">
    
    <!-- Seksioni Hero (Lajmet Kryesore) -->
    <section id="hero-section" class="grid grid-cols-1 lg:grid-cols-3 gap-4 hidden">
      <!-- Lajmi Kryesor i Madh -->
      <a href="#" id="hero-main" class="lg:col-span-2 relative rounded-2xl overflow-hidden group block h-[400px] lg:h-[500px]">
        <img id="hero-main-img" src="" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" alt="">
        <div class="absolute inset-0 gradient-overlay flex flex-col justify-end p-6 lg:p-8">
          <span id="hero-main-cat" class="bg-blue-600 text-white text-xs font-bold uppercase px-3 py-1 rounded-full w-max mb-3">Kategori</span>
          <h2 id="hero-main-title" class="text-2xl lg:text-4xl font-extrabold text-white leading-tight mb-2 group-hover:text-blue-300 transition">Titulli</h2>
          <p id="hero-main-time" class="text-gray-300 text-sm font-medium">Koha</p>
        </div>
      </a>

      <!-- Dy Lajme Anësore -->
      <div class="flex flex-col gap-4">
        <!-- Lajmi Anësor 1 -->
        <a href="#" id="hero-sub1" class="relative rounded-2xl overflow-hidden group block h-[192px] lg:h-[242px]">
          <img id="hero-sub1-img" src="" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" alt="">
          <div class="absolute inset-0 gradient-overlay flex flex-col justify-end p-5">
             <span id="hero-sub1-cat" class="text-blue-400 text-xs font-bold uppercase mb-1">Kategori</span>
             <h3 id="hero-sub1-title" class="text-lg font-bold text-white leading-snug group-hover:text-blue-300 transition line-clamp-2">Titulli</h3>
          </div>
        </a>
        <!-- Lajmi Anësor 2 -->
        <a href="#" id="hero-sub2" class="relative rounded-2xl overflow-hidden group block h-[192px] lg:h-[242px]">
          <img id="hero-sub2-img" src="" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" alt="">
          <div class="absolute inset-0 gradient-overlay flex flex-col justify-end p-5">
             <span id="hero-sub2-cat" class="text-blue-400 text-xs font-bold uppercase mb-1">Kategori</span>
             <h3 id="hero-sub2-title" class="text-lg font-bold text-white leading-snug group-hover:text-blue-300 transition line-clamp-2">Titulli</h3>
          </div>
        </a>
      </div>
    </section>

    <!-- Pjesa e Poshtme: Grid + Sidebar -->
    <section class="flex flex-col lg:flex-row gap-8">
      
      <!-- Lista e lajmeve tjera -->
      <div class="lg:w-3/4">
        <div class="mb-6 border-b pb-2">
          <h2 id="category-title" class="text-2xl font-extrabold tracking-tight">Të Fundit</h2>
        </div>
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <p class="text-gray-500 col-span-full">Duke ngarkuar lajmet...</p>
        </div>
      </div>

      <!-- Shtylla Anësore (Trending) -->
      <aside class="lg:w-1/4 space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
          <h3 class="font-extrabold text-lg mb-4 text-gray-900 border-b pb-2 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Në Trend
          </h3>
          <ul class="space-y-4 text-sm font-semibold text-gray-800">
            <li><button onclick="filterNews('Çka ka të re sot?')" class="hover:text-blue-600 transition flex items-start gap-2"><span class="text-lg">📍</span> Çka ka të re sot?</button></li>
            <li><button onclick="filterNews('Shpjegoje shkurt')" class="hover:text-blue-600 transition flex items-start gap-2"><span class="text-lg">💡</span> Shpjegoje shkurt</button></li>
            <li><button onclick="filterNews('Në xhepin tand')" class="hover:text-blue-600 transition flex items-start gap-2"><span class="text-lg">💰</span> Në xhepin tand</button></li>
            <li><button onclick="filterNews('A e keni ditë?')" class="hover:text-blue-600 transition flex items-start gap-2"><span class="text-lg">🧠</span> A e keni ditë?</button></li>
            <li><button onclick="filterNews('Hulumtime')" class="hover:text-blue-600 transition flex items-start gap-2"><span class="text-lg">🔍</span> Hulumtime</button></li>
          </ul>
        </div>

        <div class="bg-[#0f172a] rounded-2xl p-6 text-white shadow-lg">
          <h4 class="font-bold text-lg mb-2">Përmbledhja Ditore</h4>
          <p class="text-gray-400 text-sm mb-4">Lajmet kryesore direkt në emailin tuaj.</p>
          <input type="email" placeholder="Emaili juaj" class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-2 mb-3 text-sm focus:outline-none focus:border-blue-500">
          <button class="w-full bg-blue-600 hover:bg-blue-700 transition rounded-lg font-bold py-2 text-sm">Abonohu</button>
        </div>
      </aside>

    </section>
  </main>

  <footer class="bg-white border-t border-gray-200 py-8 mt-8">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-gray-500 text-sm font-medium">&copy; 2026 ZaniDigjital. Të gjitha të drejtat e rezervuara.</p>
    </div>
  </footer>

  <script>
    let allNews = [];

    async function fetchNews() {
      try {
        const res = await fetch('lajmet.json?nocache=' + new Date().getTime());
        const data = await res.json();
        // Këtu i japim çdo lajmi ID-në e vet numërore për të mos përdorur linqe të gjata
        allNews = data.map((item, index) => {
          item.originalId = index;
          return item;
        });
        filterNews('Krye'); 
      } catch (err) {
        document.getElementById('news-grid').innerHTML = '<p class="text-red-500">Nuk u gjetën lajme.</p>';
      }
    }

    function renderHero(items) {
      const heroSection = document.getElementById('hero-section');
      if (items.length < 3) {
        heroSection.classList.add('hidden');
        return;
      }
      heroSection.classList.remove('hidden');

      // Lajmi 1 - Tani dërgon ID, jo link origjinal
      document.getElementById('hero-main-title').innerText = items[0].titulli;
      document.getElementById('hero-main-cat').innerText = items[0].kategoria;
      document.getElementById('hero-main-time').innerText = items[0].koha;
      document.getElementById('hero-main-img').src = items[0].imazhi || 'https://via.placeholder.com/800x500?text=ZaniDigjital';
      document.getElementById('hero-main').href = 'artikulli.html?id=' + items[0].originalId;

      // Lajmi 2
      document.getElementById('hero-sub1-title').innerText = items[1].titulli;
      document.getElementById('hero-sub1-cat').innerText = items[1].kategoria;
      document.getElementById('hero-sub1-img').src = items[1].imazhi || 'https://via.placeholder.com/400x250?text=ZaniDigjital';
      document.getElementById('hero-sub1').href = 'artikulli.html?id=' + items[1].originalId;

      // Lajmi 3
      document.getElementById('hero-sub2-title').innerText = items[2].titulli;
      document.getElementById('hero-sub2-cat').innerText = items[2].kategoria;
      document.getElementById('hero-sub2-img').src = items[2].imazhi || 'https://via.placeholder.com/400x250?text=ZaniDigjital';
      document.getElementById('hero-sub2').href = 'artikulli.html?id=' + items[2].originalId;
    }

    function renderGrid(items) {
      const grid = document.getElementById('news-grid');
      if (items.length === 0) {
        grid.innerHTML = '<p class="text-gray-500 py-10 col-span-full">Nuk ka artikuj në këtë kategori.</p>';
        return;
      }
      // Edhe gridi tani dërgon ?id= në vend të ?link=
      grid.innerHTML = items.map(item => `
        <article class="bg-white rounded-2xl shadow-sm hover:shadow-lg transition-all duration-300 border border-gray-100 overflow-hidden flex flex-col cursor-pointer">
          <a href="artikulli.html?id=${item.originalId}" class="block relative h-40 overflow-hidden">
            ${item.imazhi ? `<img src="${item.imazhi}" alt="" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105">` : '<div class="w-full h-full bg-gray-200"></div>'}
            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur text-gray-900 text-[10px] font-bold uppercase px-2 py-1 rounded-md shadow-sm">${item.kategoria}</span>
          </a>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <h2 class="text-[17px] font-extrabold mt-1 mb-2 leading-snug text-gray-900 hover:text-blue-600 transition line-clamp-3">
                <a href="artikulli.html?id=${item.originalId}">${item.titulli}</a>
              </h2>
            </div>
            <div class="mt-3 pt-3 border-t border-gray-50 text-xs text-gray-400 font-medium flex items-center justify-between">
              <span>🕒 ${item.koha.split(' ')[1] || item.koha}</span>
            </div>
          </div>
        </article>
      `).join('');
    }

    function filterNews(cat) {
      const titleEl = document.getElementById('category-title');
      if (cat === 'Krye') {
        titleEl.innerText = 'Të Fundit';
        renderHero(allNews);
        renderGrid(allNews.slice(3)); 
      } else {
        titleEl.innerText = cat;
        document.getElementById('hero-section').classList.add('hidden'); 
        renderGrid(allNews.filter(n => n.kategoria === cat));
      }
    }

    fetchNews();
  </script>
</body>
</html>
