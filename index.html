<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZaniDigjital - Lajme të zgjedhura. Në një vend.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    /* Prapavija e errët për t'u përshtatur me logon */
    .header-dark { background-color: #060913; } 
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- Header me Logon dhe Rubrikat Kryesore -->
  <header class="header-dark border-b-4 border-blue-600 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col lg:flex-row justify-between items-center gap-6">
      
      <!-- Logoja -->
      <a href="#" onclick="filterNews('Krye')" class="flex-shrink-0">
        <img src="logo.jpg" alt="ZaniDigjital Logo" class="h-12 object-contain">
      </a>
      
      <!-- Rubrikat Kryesore -->
      <nav id="main-categories" class="flex flex-wrap justify-center gap-3 text-sm font-semibold uppercase text-gray-300">
        <button onclick="filterNews('Krye')" class="hover:text-blue-500 transition-colors">Krye</button>
        <button onclick="filterNews('Lajme')" class="hover:text-blue-500 transition-colors">Lajme</button>
        <button onclick="filterNews('Kosovë')" class="hover:text-blue-500 transition-colors">Kosovë</button>
        <button onclick="filterNews('Politikë')" class="hover:text-blue-500 transition-colors">Politikë</button>
        <button onclick="filterNews('Ekonomi')" class="hover:text-blue-500 transition-colors">Ekonomi</button>
        <button onclick="filterNews('Sport')" class="hover:text-blue-500 transition-colors">Sport</button>
        <button onclick="filterNews('Botë')" class="hover:text-blue-500 transition-colors">Botë</button>
        <button onclick="filterNews('Kulturë')" class="hover:text-blue-500 transition-colors">Kulturë</button>
        <button onclick="filterNews('Teknologji')" class="hover:text-blue-500 transition-colors">Teknologji</button>
        <button onclick="filterNews('Auto')" class="hover:text-blue-500 transition-colors">Auto</button>
      </nav>
    </div>
  </header>

  <!-- Përmbajtja -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">
    
    <!-- Seksioni i Lajmeve -->
    <div class="md:w-3/4">
      <div class="mb-6 flex items-center justify-between">
        <h2 id="current-category-title" class="text-2xl font-bold border-l-4 border-blue-600 pl-3">Të Fundit</h2>
      </div>
      <div id="news-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <p class="text-gray-500 py-10">Duke ngarkuar lajmet...</p>
      </div>
    </div>

    <!-- Shtylla Anësore (Rubrikat Kreative) -->
    <aside class="md:w-1/4 space-y-6">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
        <h3 class="font-extrabold text-lg mb-4 text-gray-900 border-b pb-2">Në Trend 🔥</h3>
        <ul class="space-y-3 text-sm font-semibold text-gray-700">
          <li><button onclick="filterNews('Çka ka të re sot?')" class="hover:text-blue-600 flex items-center gap-2">📍 Çka ka të re sot?</button></li>
          <li><button onclick="filterNews('Shpjegoje shkurt')" class="hover:text-blue-600 flex items-center gap-2">💡 Shpjegoje shkurt</button></li>
          <li><button onclick="filterNews('Në xhepin tand')" class="hover:text-blue-600 flex items-center gap-2">💰 Në xhepin tand</button></li>
          <li><button onclick="filterNews('A e keni ditë?')" class="hover:text-blue-600 flex items-center gap-2">🧠 A e keni ditë?</button></li>
          <li><button onclick="filterNews('Hulumtime')" class="hover:text-blue-600 flex items-center gap-2">🔍 Hulumtime</button></li>
        </ul>
      </div>
    </aside>
  </main>

  <!-- Footer -->
  <footer class="bg-[#060913] text-gray-400 py-8 mt-12 border-t-4 border-blue-600">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <img src="logo.jpg" alt="ZaniDigjital Logo" class="h-8 mx-auto mb-4 opacity-50 grayscale">
      <p>&copy; 2026 ZaniDigjital. Të gjitha të drejtat e rezervuara.</p>
    </div>
  </footer>

  <script>
    let allNews = [];

    async function fetchNews() {
      try {
        const res = await fetch('lajmet.json?nocache=' + new Date().getTime());
        allNews = await res.json();
        filterNews('Krye'); // Shfaq lajmet kryesore në fillim
      } catch (err) {
        document.getElementById('news-grid').innerHTML = '<p class="text-red-500">Nuk u gjetën lajme momentalisht.</p>';
      }
    }

    function renderNews(items) {
      const grid = document.getElementById('news-grid');
      if (items.length === 0) {
        grid.innerHTML = '<p class="text-gray-500 py-10">Nuk ka artikuj në këtë kategori.</p>';
        return;
      }
      grid.innerHTML = items.map(item => `
        <article class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 overflow-hidden flex flex-col">
          ${item.imazhi ? `<img src="${item.imazhi}" alt="" class="h-48 w-full object-cover">` : '<div class="h-48 w-full bg-gray-100"></div>'}
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-blue-600 text-xs font-bold uppercase tracking-wider">${item.kategoria}</span>
              <h2 class="text-lg font-bold mt-2 mb-3 leading-tight text-gray-900">${item.titulli}</h2>
              <p class="text-sm text-gray-600 line-clamp-3">${item.permbajtja}</p>
            </div>
            <div class="mt-4 pt-4 border-t border-gray-100 text-xs text-gray-400 flex justify-between">
              <span>${item.koha}</span>
              <a href="${item.link_origjinal}" target="_blank" class="hover:text-blue-500 font-semibold">Lexo më shumë →</a>
            </div>
          </div>
        </article>
      `).join('');
    }

    function filterNews(cat) {
      document.getElementById('current-category-title').innerText = cat === 'Krye' ? 'Të Fundit' : cat;
      if (cat === 'Krye') {
        renderNews(allNews);
      } else {
        renderNews(allNews.filter(n => n.kategoria === cat));
      }
    }

    fetchNews();
  </script>
</body>
</html>
